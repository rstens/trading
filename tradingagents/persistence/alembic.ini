# Alembic config for the TradingAgents persistence package.
#
# Usage:
#   python -m tradingagents.persistence upgrade        # apply all migrations
#   python -m tradingagents.persistence downgrade      # one step down
#
# The wrapper script at `tradingagents/persistence/__main__.py` reads this
# file and points alembic at `migrations/` relative to the package. Direct
# `alembic -c ...` invocation also works, but the env-var-driven URL
# lookup in `env.py` is the same either way.

[alembic]
# Resolved at runtime in env.py — pointed at migrations/ inside the
# package via the wrapper. Set here for manual `alembic` invocations.
script_location = migrations
prepend_sys_path = .
# Use revision id as the filename prefix; keep slugs short.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

# DB URL is sourced from TRADINGAGENTS_DATABASE_URL via env.py;
# leaving this blank intentionally.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
